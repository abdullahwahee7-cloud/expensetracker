{% extends "layout.html" %}

{% block title %}
Register
{% endblock %}

{% block main %}
<h2>Financial Tracker</h2>
<img class="mb-4" src="/static/logo.png" alt="logo" width="90" height="90">

<br>
<h1 class="h3 mb-3 font-weight-normal">Register an account</h1>
{% if username %}
<div class="alert alert-dismissible alert-danger">
    <button type="button" class="close" data-dismiss="alert">&times;</button>
    The username '{{ username }}' is taken. Please try a new one.
</div>
{% endif %}
<form action="/register" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div class="form-group">
        <input autocomplete="off" autofocus class="form-control validate-register" name="username" id="username"
            type="text" placeholder="Username" required pattern="^[a-zA-Z0-9]{3,16}$"
            title="Contain between 3 and 16 characters, lower/uppcase letters and numbers only">
    </div>
    <div class="form-group">
        <input class="form-control validate-register" name="password" id="password" type="password" placeholder="Password" required
            pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
            title="Length must be at least 8 characters and contain minimum of one number, one lowercase letter, and one uppercase letter">
    </div>
    <br>
    <button class="btn btn-primary" id="btnRegister" type="submit">Register</button>
</form>

{% endblock %}
